[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragpilot"
version = "0.1.0"
description = "Local-first knowledge compiler and retrieval engine CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "RAGpilot" }]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
ragpilot = "ragpilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpilot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
