name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Docling pulls in torch as a base dependency (for PDF layout/table
      # structure models). PyPI's default Linux torch wheel bundles CUDA
      # (several GB of nvidia-* packages neither this CI nor Phase 3's
      # OCR-off, GPU-free pipeline needs) -- installing the CPU-only build
      # first so torch's own resolution is already satisfied keeps this
      # job's install size and time reasonable. macOS/Windows PyPI wheels
      # are CPU-only already, so this is Linux-only. torchvision must come
      # from the SAME index in the SAME command: resolving it separately
      # (e.g. later, from default PyPI, as a transitive dependency) can
      # pick a torchvision build compiled against a different torch build
      # than the one just installed, which fails at import time with
      # "operator torchvision::nms does not exist".
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/ragpilot

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        if: matrix.os == 'ubuntu-latest'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest
        # docling_pdf-marked tests are excluded by default (see
        # pyproject.toml's addopts) -- they exercise Docling's real PDF
        # pipeline, which downloads model weights on first use, and must
        # not gate this job's pass/fail. See the docling-pdf-tests job
        # below for that coverage, run non-blocking.
        run: pytest -q

  # Optional, non-blocking: actually runs Docling's PDF conversion (model
  # download from Hugging Face included). Kept separate from `test` above
  # so a slow/unavailable model download never gates a merge -- see
  # CONTRIBUTING.md for the same command run locally.
  docling-pdf-tests:
    name: Docling PDF tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Cache Docling/Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-hf-models-${{ runner.os }}
      - name: Pytest (docling_pdf)
        run: pytest -m docling_pdf -q

  # Optional, non-blocking: spawns and signals a real, detached
  # `ragpilot daemon` process (Phase 7). Kept separate from `test` above
  # so process-startup/signal-delivery timing on a given runner never
  # gates a merge -- the daemon loop itself is already covered by `test`
  # above via direct, process-free unit/integration tests. See
  # CONTRIBUTING.md for the same command run locally.
  daemon-subprocess-tests:
    name: Daemon subprocess tests (non-blocking)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        if: matrix.os == 'ubuntu-latest'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (daemon_subprocess)
        run: pytest -m daemon_subprocess -q

  # Optional, non-blocking: actually loads Phase 9's real local embedding
  # model (Hugging Face weight download included). Kept separate from
  # `test` above so a slow/unavailable model download never gates a
  # merge -- same rationale and pattern as `docling-pdf-tests` above; see
  # CONTRIBUTING.md for the same command run locally.
  embedding-model-tests:
    name: Embedding model tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: embedding-model-hf-${{ runner.os }}
      - name: Pytest (embedding_model)
        run: pytest -m embedding_model -q

  # Optional, non-blocking: generates a synthetic search corpus and
  # measures real query latency (benchmarks/search/), printing a report.
  # Non-blocking because its numbers are only meaningful on real,
  # unshared hardware (see benchmarks/search/targets.py) -- a busy CI
  # runner missing the blueprint's millisecond targets is not a
  # regression signal, so this job never hard-fails on that; it does
  # still fail if the pipeline itself breaks (an exception, or a known
  # fixture that stops being found). See CONTRIBUTING.md for the same
  # command run locally, including larger corpus sizes.
  benchmark-search-tests:
    name: Search benchmark suite (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (benchmark_search)
        run: pytest -m benchmark_search -q -s

  # Optional, non-blocking: measures subprocess wall-clock startup for the
  # lightweight commands (benchmarks/cli_startup/) and prints a latency
  # report. Non-blocking for the same reason benchmark-search-tests is:
  # its numbers are only meaningful on real, unshared hardware, so a busy
  # CI runner missing a target is not a regression signal. The always-on,
  # hard-gating regression check for CLI startup is the architectural
  # import test in the `test` job above (tests/unit/test_cli_startup_imports.py).
  cli-startup-benchmark-tests:
    name: CLI startup benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch (Linux runners pull CUDA by default)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Pytest (cli_startup_benchmark)
        run: pytest -m cli_startup_benchmark -q -s

  # Optional, non-blocking: runs install.sh/install.ps1 exactly as a real
  # user would (curl/irm into a shell), pointed at *this* branch/commit via
  # RAGPILOT_REF, and verifies the resulting `ragpilot` launcher actually
  # works. Non-blocking because it repeats the same heavy dependency
  # download (torch, docling) as the jobs above, on top of a real network
  # fetch of the branch tarball/zipball from GitHub -- see CONTRIBUTING.md
  # for the same commands run locally.
  install-script-tests:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.sh against this branch
        env:
          RAGPILOT_REF: ${{ github.head_ref || github.ref_name }}
          RAGPILOT_INSTALL_DIR: ${{ runner.temp }}/ragpilot-install
          RAGPILOT_BIN_DIR: ${{ runner.temp }}/ragpilot-bin
          RAGPILOT_HOME: ${{ runner.temp }}/ragpilot-home
        run: sh ./install.sh
      - name: Verify the installed CLI works
        env:
          RAGPILOT_HOME: ${{ runner.temp }}/ragpilot-home
        run: |
          "${{ runner.temp }}/ragpilot-bin/ragpilot" version
          "${{ runner.temp }}/ragpilot-bin/ragpilot" doctor
      - name: Verify install-script metadata was written (update/installer.py detection)
        run: |
          test -f "${{ runner.temp }}/ragpilot-home/install_info.json"
          grep -q '"install_method": "install-script"' "${{ runner.temp }}/ragpilot-home/install_info.json"

  install-script-tests-windows:
    name: Install script (windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.ps1 against this branch
        env:
          RAGPILOT_REF: ${{ github.head_ref || github.ref_name }}
          RAGPILOT_INSTALL_DIR: ${{ runner.temp }}\ragpilot-install
          RAGPILOT_BIN_DIR: ${{ runner.temp }}\ragpilot-bin
          RAGPILOT_HOME: ${{ runner.temp }}\ragpilot-home
        run: ./install.ps1
      - name: Verify the installed CLI works
        env:
          RAGPILOT_HOME: ${{ runner.temp }}\ragpilot-home
        run: |
          & "${{ runner.temp }}\ragpilot-bin\ragpilot.cmd" version
          & "${{ runner.temp }}\ragpilot-bin\ragpilot.cmd" doctor
      - name: Verify install-script metadata was written (update/installer.py detection)
        run: |
          $infoPath = "${{ runner.temp }}\ragpilot-home\install_info.json"
          if (-not (Test-Path $infoPath)) { throw "missing $infoPath" }
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          if ($info.install_method -ne "install-script") { throw "unexpected install_method: $($info.install_method)" }
